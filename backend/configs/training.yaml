symbol: GBPUSD
primary_timeframe: M15
context_pairs:
  - EURUSD
  - USDJPY
  - EURGBP
  - DXY

data:
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  embargo_bars: 4

label:
  upper_atr_multiplier: 1.5
  lower_atr_multiplier: 1.0
  time_barrier_bars: 4

xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 15
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
  eval_metric: mlogloss
  early_stopping_rounds: 30

optuna:
  n_trials: 50
  timeout_seconds: 600

calibration:
  method: isotonic  # isotonic or sigmoid
