services:
  mongo:
    image: mongo:8.0
    container_name: fxmind-mongo
    environment:
      MONGO_INITDB_DATABASE: fxmind
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
